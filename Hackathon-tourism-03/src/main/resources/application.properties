spring.application.name=Hackathon-tourism-03
# H2 Database
spring.datasource.url=jdbc:h2:mem:tourismdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=secret123

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Frontend API
# Folder with places.geojson, vocabulary.json and meta.json from TFT_Hackathon_2026
app.data-dir=${DATA_DIR:../../VersaliteLTD/TFT_Hackathon_2026/data/processed/internal}
app.cors-origins=${CORS_ORIGINS:*}
# Separate CC BY-SA street layer: never merge into the place data
app.street-layer-file=${STREET_LAYER_FILE:../../VersaliteLTD/TFT_Hackathon_2026/data/raw/hackathon_veterans/accessibility_features.geojson}
